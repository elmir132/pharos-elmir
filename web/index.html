<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PharOs near-miss agent</title>
<style>
:root{--bg:#0e1420;--card:#172033;--ink:#e8edf7;--mute:#9aa7bd;--accent:#ff7a45;--ok:#47c98a}
@media (prefers-color-scheme: light){:root{--bg:#f4f6fb;--card:#fff;--ink:#16202f;--mute:#5a6678}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:1000px;margin:auto}h1{margin:0;font-size:24px}p.sub{color:var(--mute);margin:4px 0 12px}
form{display:flex;gap:8px;max-width:1000px;margin:0 auto 12px;padding:0 16px}
input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid #3a4660;background:var(--card);color:var(--ink);font-size:16px}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
main{max-width:1000px;margin:auto;padding:0 16px 40px;display:grid;gap:14px}
.card{background:var(--card);border-radius:12px;padding:14px;display:grid;gap:10px}
@media(min-width:760px){.card{grid-template-columns:360px 1fr}}
video{width:100%;border-radius:8px;background:#000}
.sev{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}
table{border-collapse:collapse;font-size:14px}td{padding:2px 12px 2px 0;color:var(--mute)}td+td{color:var(--ink)}
.tag{font-size:12px;color:var(--ok)}
</style></head><body>
<header><h1>PharOs</h1><p class="sub">Near misses in camera footage, each one with the measurements behind it.</p></header>
<form id="f"><input id="q" placeholder="Search events, for example: person and car"><button>Search</button></form>
<main id="list"></main>
<script>
const list=document.getElementById('list');
function row(e){
  const ev=e.evidence, ttc=ev.ttc_s_at_peak_closing;
  const div=document.createElement('div');div.className='card';
  div.innerHTML=`<video controls preload="metadata" src="/out/${e.clip}"></video><div>
  <div><span class="sev">severity ${e.severity}</span> <b>${e.classes.join(' + ')}</b> at ${e.t_closest.toFixed(1)} s</div>
  <p>${e.explanation.text} <span class="tag">${e.explanation.source==='model'?'model sentence, numbers checked':'measured sentence'}</span></p>
  <table><tr><td>closest gap</td><td>${ev.min_gap_body_units} body units (${ev.min_gap_px} px)</td></tr>
  <tr><td>peak closing speed</td><td>${ev.peak_closing_body_units_per_s} body units per second</td></tr>
  <tr><td>time to collision</td><td>${ttc===null?'not defined':ttc+' s'}</td></tr>
  <tr><td>window</td><td>${e.t_start.toFixed(1)} to ${e.t_end.toFixed(1)} s</td></tr></table></div>`;
  return div;}
async function show(url){list.innerHTML='';const r=await (await fetch(url)).json();
  if(!r.length){list.textContent='No events yet. Run: python -m pharos.pipeline data/<video>.mp4';return;}
  r.forEach(e=>list.appendChild(row(e)));}
document.getElementById('f').onsubmit=ev=>{ev.preventDefault();const q=document.getElementById('q').value.trim();
  show(q?'/api/search?q='+encodeURIComponent(q):'/api/events');};
show('/api/events');
</script></body></html>
